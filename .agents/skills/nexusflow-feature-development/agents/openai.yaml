interface:
  display_name: "NexusFlow Feature Development"
  short_description: "Build product features with full-flow traceability"
  default_prompt: "Use $nexusflow-feature-development to implement this NexusFlow product requirement or behavior fix. Reconstruct the user flow, decide App/Contracts/Backend/AI scope, reuse existing implementations first, hand structural decisions to an independent Architect through $nexusflow-ai-handoff with a self-contained Work Order deliverable, implement dependency-driven thin slices, and finish with a Human Takeover Check based on the actual code."
